<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Standalone Mods</title>
    <style>
        /* --- GLOBAL STYLES --- */
        body {
                background: linear-gradient(180deg, #081b18 0%, #0e2d29 100%);
                color: #eafff9;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: flex-start;
                min-height: 100vh;
                margin: 0;
                padding: 60px 20px;
                box-sizing: border-box;
        }

        /* --- GLOWING TYPEWRITER EFFECT --- */
        .title-container {
                height: 60px;
                display: flex;
                align-items: center;
                justify-content: center;
                margin-bottom: 50px;
        }

        .typewriter-text {
                font-size: 2.5rem;
                font-weight: bold;
                color: #d8fff8;
                text-shadow:
                        0 0 10px rgba(0, 255, 200, 0.7),
                        0 0 20px rgba(0, 255, 200, 0.45),
                        0 0 40px rgba(0, 255, 170, 0.25);
                letter-spacing: 2px;
                border-right: 3px solid #3cffc8;
                white-space: nowrap;
                background: transparent;
                padding-right: 4px;
                animation: blink 0.75s step-end infinite;
        }

        @keyframes blink {
                from, to {
                        border-color: transparent;
                }

                50% {
                        border-color: #3cffc8;
                }
        }

        /* --- BUTTONS CONTAINER --- */
        .links-container {
                width: 100%;
                max-width: 500px;
                display: flex;
                flex-direction: column;
                gap: 20px;
        }

        /* --- CARD STYLES --- */
        .card-link {
                background: linear-gradient(135deg, #10332d 0%, #174842 100%);
                border: 1px solid #2c8c78;
                border-radius: 14px;
                padding: 15px 20px;
                text-decoration: none;
                color: #ffffff;
                display: flex;
                flex-direction: column;
                transition: all 0.25s ease;
                box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
        }

        .card-link:hover {
                transform: translateY(-4px);
                border-color: #44ffd3;
                background: linear-gradient(135deg, #15463d 0%, #1d5f55 100%);
                box-shadow:
                        0 0 18px rgba(0, 255, 187, 0.25),
                        0 12px 30px rgba(0, 0, 0, 0.4);
        }

        .btn-name {
                font-size: 1.25rem;
                font-weight: bold;
                color: #5affdc;
                margin-bottom: 5px;
        }

        .btn-description {
                font-size: 0.9rem;
                color: #b7e7dd;
                line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="title-container">
        <div class="typewriter-text" id="typewriter"></div>
    </div>

    <div class="links-container">

        <a href="mods.html" download class="card-link">
            <span class="btn-name">ByteMods ADB Port (v2)</span>
            <span class="btn-description">Coming Soon</span>
        </a>

    </div>

    <script>
        const textArray = ["Standalone Mods"]; 
        
        let textIndex = 0;
        let charIndex = 0;
        let isDeleting = false;
        const typeSpeed = 150;  
        const eraseSpeed = 100; 
        const delayBetween = 2500; 
        const typewriterElement = document.getElementById("typewriter");

        function type() {
            const currentText = textArray[textIndex];
            
            if (isDeleting) {
                typewriterElement.textContent = currentText.substring(0, charIndex - 1);
                charIndex--;
            } else {
                typewriterElement.textContent = currentText.substring(0, charIndex + 1);
                charIndex++;
            }

            let nextActionSpeed = isDeleting ? eraseSpeed : typeSpeed;

            if (!isDeleting && charIndex === currentText.length) {
                nextActionSpeed = delayBetween; 
                isDeleting = true;
            } else if (isDeleting && charIndex === 0) {
                isDeleting = false;
                textIndex = (textIndex + 1) % textArray.length; // Moves to next text if you add more
                nextActionSpeed = 500; 
            }

            setTimeout(type, nextActionSpeed);
        }

        document.addEventListener("DOMContentLoaded", function() {
            setTimeout(type, 500);
        });
    </script>

</body>
</html>
